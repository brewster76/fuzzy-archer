            [[[[week]]]]
                show = false
            [[[[month]]]]
                show = false
            [[[[year]]]]
                aggregateType = max
        [[[min_outTemp]]]
            obs_type = outTemp
            showMaxMarkPoint = false
            showMinMarkPoint = true
            showAvgMarkLine = false
            lineColor = '#428bca'
            decimals = 1
            [[[[day]]]]
                show = false
            [[[[week]]]]
                show = false
            [[[[month]]]]
                show = false
            [[[[year]]]]
                aggregateType = min

    [[barometer]]
        [[[barometer]]]
            showMaxMarkPoint = true
            showMinMarkPoint = true
