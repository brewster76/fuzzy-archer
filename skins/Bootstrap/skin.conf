#
############################################################################################
#
# Period views Day / Week / Month / Year (ECharts, data files written by
# user.historydata.PeriodDataGenerator). See docs/historic-data-contract.md, section 6.
# Display options have the same meaning as in [LiveCharts]; payload_key and MQTT options do not apply.
#
[PeriodCharts]
    # This list determines which charts appear in the period views, as well as in which order.
    period_chart_items = outTemp, barometer, rain, outHumidity, wind, windDir, radiation

    generate = true             # false: this report only displays the data of another report
    data_url = historic_data    # data directory relative to this report's pages
    show_daynight = true        # day/week only
    transition_angle = 8
    gap_threshold = 1           # missing archive records tolerated before a period is marked as gaps (%)
                                # Changing it requires: python -m user.historyregen --period all
    #state_root =               # default <WEEWX_ROOT>/<SQLITE_ROOT>/fuzzy_archer
    max_retries = 3
    retry_backoff = 600
    backfill_pause = 0.02

    [[refresh]]                 # seconds between regenerations of the running/rolling files, 0 = every report run
        day = 0
        week = 3600
        month = 10800
        year = 21600

    [[defaults]]                # resolution per view: native or PT5M .. PT6H, P1D
        line_aggregate_type = avg
        [[[day]]]
            line = native
            bar = native
        [[[week]]]
            line = PT15M
            bar = PT1H
        [[[month]]]
            line = PT2H
            bar = P1D
        [[[year]]]
            line = P1D
            bar = P1D

    [[outTemp]]
