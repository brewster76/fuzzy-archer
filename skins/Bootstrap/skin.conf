[HistoryReport]
    #
    # Settings for the HTML month/year color coded summary table generator
    #

    # This list determines which tables will appear in the history report, as well as in which order.
    history_items = min_temp, avg_temp, max_temp, rain, rain_days, max_wind, NOAA

    # Restrict the size of the table by ignoring everything before startdate
    # Specify in unix epoch time. e.g. 1325376000 is 1-Jan-2012
    # Note: whatever you specify as startdate, the whole year (or better: all
    # the values availlable for this year) this startdate is within, will be included in the table.
    #startdate = 1325376000

    # Depending on computing power it can take some time to calculate all the summaries with a few years of weather date.
    # refresh_interval is how often in minutes the tables are calculated.
    refresh_interval = 5

    [[min_temp]]
        obs_type = outTemp                 # obs_type can be any weewx reading
        aggregate_type = min               # Any of these: 'sum', 'count', 'avg', 'max', 'min'
        #for the next items, default is false
        summary_column = true              #show the summary column
        alltime_min = true                 #show the alltime minimum for each month and year, only fully covered months and years are considered, if the aggregation_type is 'min', also partially covered months and years are considered
        alltime_avg = true                 #show the alltime average for each month and year, only fully covered months and years are considered
        alltime_max = true                 #show the alltime maximum for each month and year, only fully covered months and years are considered, if the aggregation_type is 'max', also partially covered months and years are considered

    #
    # You can also use these aggregate_types:  'max_ge', 'max_le', 'min_le', 'sum_ge' to count days
    # where an observation is ge: greater of equalto, or le: lessthan or equal to a threshold value
    # To specify this threshold, use: aggregate_threshold = [value], [units]
    #
    # e.g Specify temperature threshold of 20C:  aggregate_threshold = 20, degree_C
    #

    [[avg_temp]]
        obs_type = outTemp
        aggregate_type = avg
        summary_column = true
        alltime_min = true
        alltime_avg = true
        alltime_max = true

    [[max_temp]]
        obs_type = outTemp
        aggregate_type = max
        summary_column = true
        alltime_min = true
        alltime_avg = true
        alltime_max = true

    [[rain]]
        obs_type = rain
        aggregate_type = sum
        summary_column = true
        alltime_min = true
        alltime_avg = true
        alltime_max = true

    [[rain_rate]]
        obs_type = rainRate
        aggregate_type = max
        summary_column = true
        alltime_min = true
        alltime_avg = true
        alltime_max = true

    [[rain_days]]
        obs_type = rain
        colors = rainDays, count # colors are derived from obs_type per default, specify colors from [Colors] to override
        units = ""                        # Override default table units label
        aggregate_type = sum_ge
        aggregate_threshold = 1, mm
        summary_column = true
        alltime_min = true
        alltime_avg = true
        alltime_max = true

    [[max_wind]]
        obs_type = windGust
        aggregate_type = max
        summary_column = true
        alltime_min = true
        alltime_avg = true
        alltime_max = true

    [[lightning_strike_count]]
        obs_type = lightning_strike_count
        aggregate_type = sum
        summary_column = true
        alltime_min = true
        alltime_avg = true
        alltime_max = true

    [[summer_days]]
        obs_type = outTemp
        colors = summerDays, count    # colors are derived from obs_type per default, specify colors from [Colors] to override
        units = ""    # Override default table units label
        aggregate_type = max_ge
        aggregate_threshold = 25, degree_C
        summary_column = true
        alltime_min = true
        alltime_avg = true
        alltime_max = true

    [[hot_days]]
        obs_type = outTemp
        colors = hotDays, count    # colors are derived from obs_type per default, specify colors from [Colors] to override
        units = ""    # Override default table units label
        aggregate_type = max_ge
        aggregate_threshold = 30, degree_C
        summary_column = true
        alltime_min = true
        alltime_avg = true
        alltime_max = true

    [[desert_days]]
        obs_type = outTemp
        colors = desertDays, count    # colors are derived from obs_type per default, specify colors from [Colors] to override
        units = ""    # Override default table units label
        aggregate_type = max_ge
        aggregate_threshold = 35, degree_C
        summary_column = true
        alltime_min = true
        alltime_avg = true
        alltime_max = true

    [[vegetations_days]]
        obs_type = outTemp
        colors = vegetationDays, count    # colors are derived from obs_type per default, specify colors from [Colors] to override
        units = ""    # Override default table units label
        aggregate_type = avg_ge
        aggregate_threshold = 5, degree_C
        summary_column = true
        alltime_min = true
        alltime_avg = true
        alltime_max = true

    [[frost_days]]
        obs_type = outTemp
        colors = frostDays, count    # colors are derived from obs_type per default, specify colors from [Colors] to override
        units = ""    # Override default table units label
        aggregate_type = min_le
        aggregate_threshold = 0, degree_C
        summary_column = true
        alltime_min = true
        alltime_avg = true
        alltime_max = true

    [[ice_days]]
        obs_type = outTemp
        colors = iceDays, count    # colors are derived from obs_type per default, specify colors from [Colors] to override
        units = ""    # Override default table units label
        aggregate_type = max_le
        aggregate_threshold = 0, degree_C
        summary_column = true
        alltime_min = true
        alltime_avg = true
        alltime_max = true

    [[NOAA]]
        #
        # Creates a table of links to NOAA reports with the tag $NOAA_table
        # Comment out [[NOAATable]] if you do not need this.
        #

        # Where to find the NOAA files and how they are named
        # Uses Python datetime convention (docs.python.org/2/library/datetime.html):
        # %Y = YYYY, %y = YY, %m = MM, etc.
        #
        year_filename = NOAA/NOAA-%Y.txt
        month_filename = NOAA/NOAA-%Y-%m.txt

[Stats]
    # This list determines which tables will appear on the stats page, as well as in which order.
    stats_items = outTemp, rain, rainRate, barometer, wind
    [[outTemp]]
        since_ever = true # optional, default true
        [[[max]]]
        [[[min]]]
        [[[maxmin]]]
